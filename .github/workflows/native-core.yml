# Compile the Pearl CUDA core.
#
# The runners have no GPU, so nothing here mines. What this workflow is for is
# producing a BINARY: the dev box has an RTX 4090 and a current driver but no
# CUDA toolkit and no MSVC, and cannot install either (not an administrator).
# The runners have exactly what it lacks. So CI compiles and links the addon,
# uploads it, and the GPU box downloads that artifact and runs it — which is how
# device-side behaviour gets verified at all.
#
# It also catches what code review cannot: pearl_core.cc declares four extern "C"
# entry points, and if pearl_host.cu drifts from them the addon compiles cleanly
# and fails at LINK time.
#
# In particular this catches the class of error that bit us before the host file
# existed: pearl_core.cc declares four extern "C" entry points, and if
# pearl_host.cu drifts from those declarations the addon compiles fine and fails
# at LINK time. A compile-only job finds that; reading the diff does not.
#
# The device-side semantics are checked separately and without a GPU, by the JS
# reference and its known-answer vectors (test/minerReference.test.js), whose
# BLAKE3 foundation is validated against the official published vectors.

name: native core

on:
  push:
    paths:
      - 'earn/native/**'
      - '.github/workflows/native-core.yml'
  pull_request:
    paths:
      - 'earn/native/**'
      - '.github/workflows/native-core.yml'
  workflow_dispatch:

jobs:
  build:
    # Two builds per OS. The first two entries are the core every rig has run
    # (CUDA 12.8.1, sm_86/89/120); their job names ("ubuntu-latest",
    # "windows-2022") and artifact names (pearl-core-<os>) are unchanged, and
    # miner-build.yml still downloads them by those names.
    #
    # The "-cu13" entries build the same source with a CUDA 13 toolkit for
    # sm_89 and sm_120, shipped as pearl_core_cu13.node. ptxas 13 compiles the
    # Blackwell fold far better than 12.8 does -- statically 2.67-3.0
    # instructions per IMMA with 160/192 B operands reused, against 3.891 with
    # 0/192 -- and on an RTX 5090 at 600 W the same v0.5.7 source ran 107.27
    # TH/s built with 13.3 against 103.97 with 12.8.1 (+3.2%). The sm_89 half
    # is unmeasured. It is built so the Ada fold under ptxas 13.3 can be
    # benched on a 4090 before the app is allowed to load it on Ada: point
    # probes/hashrate.js and probes/verify-hits.js at pearl_core_cu13.node
    # (they take the .node path as their first argument and read no
    # environment variable). PEARL_CORE_VARIANT=cu13 is the override for the
    # app and earn-cli only, and like any use of this build needs driver 580+.
    # Today the app loads it only on an all-Blackwell rig. No sm_86, so the
    # 3090 code path never changes. It is a separate file because a CUDA 13
    # runtime needs driver 580+: the app loads it only with a new enough
    # driver (src/shared/coreVariant.js).
    name: ${{ matrix.os }}${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            variant: ''
            file: pearl_core.node
            # 12.8 is the first toolkit that knows sm_120 (Blackwell), and needs
            # action v0.2.36+ — older tags carry a version table that predates it
            # and answer "Version not available".
            cuda: '12.8.1'
            release: '12.8'
            # cuobjdump for the tensor-map offset check after the compile; it is
            # its own package on both platforms and nvcc does not pull it in.
            subpackages: '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev", "cuobjdump"]'
            gencode: >-
              -gencode arch=compute_86,code=sm_86
              -gencode arch=compute_89,code=sm_89
              -gencode arch=compute_120,code=sm_120
            # Architectures on which a register spill in a fold kernel fails
            # the job (the spill check below). Only where the tuning log has a
            # 0-spill figure for this compiler: sm_89 under 12.8 (tall fold
            # 253 registers, wmma fold 255). sm_86 has no recorded figure, and
            # the log's sm_120 figures (tall fold 248 registers) are ptxas
            # 13.3's, not 12.8's, so on those a spill is a warning until a run
            # has shown them clean; then add them here.
            spill_fail_archs: sm_89
          - os: windows-2022
            variant: ''
            file: pearl_core.node
            cuda: '12.8.1'
            release: '12.8'
            subpackages: '["nvcc", "cudart", "nvrtc", "cuobjdump"]'
            gencode: >-
              -gencode arch=compute_86,code=sm_86
              -gencode arch=compute_89,code=sm_89
              -gencode arch=compute_120,code=sm_120
            spill_fail_archs: sm_89
          # 13.3.1 is the newest toolkit Jimver/cuda-toolkit v0.2.36 (the
          # version already pinned here) lists, on Linux and Windows alike, and
          # it is the toolkit the 5090 rig builds with (nvcc V13.3.73) -- so the
          # measured 107.27 TH/s is this compiler's code. On Linux the action
          # installs from NVIDIA's apt repo, which resolves cuda-nvcc-13-3 to
          # 13.3.73, the same nvcc.
          - os: ubuntu-latest
            variant: '-cu13'
            file: pearl_core_cu13.node
            cuda: '13.3.1'
            release: '13.3'
            # The same list as 12.8: apt pulls nvcc's split-out pieces (crt,
            # nvvm, nvptxcompiler) in as dependencies of cuda-nvcc-13-3.
            subpackages: '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev", "cuobjdump"]'
            gencode: >-
              -gencode arch=compute_89,code=sm_89
              -gencode arch=compute_120,code=sm_120
            # sm_120 under 13.3 is the measured build (tall fold 248
            # registers, 0 spill). sm_89 under 13.3 is unmeasured, and 13.3
            # spilled 24 bytes of the untrimmed cp.async ring when it was
            # built for sm_120 (src/pearl_config.h, PEARL_TALL_TMA). A spill
            # in the sm_89 half must not cost Blackwell its core, so there it
            # is a warning until the 4090 A/B has been run.
            spill_fail_archs: sm_120
          - os: windows-2022
            variant: '-cu13'
            file: pearl_core_cu13.node
            cuda: '13.3.1'
            release: '13.3'
            # CUDA 13 on Windows split crt, nvvm and nvptxcompiler out of the
            # nvcc component (they are separate entries in 13.3.1's installer
            # list and absent from 12.8.1's), and the Windows installer is given
            # exactly the list it installs. Named explicitly so nvcc has its
            # headers and its back end.
            subpackages: '["nvcc", "crt", "nvvm", "nvptxcompiler", "cudart", "nvrtc", "cuobjdump"]'
            gencode: >-
              -gencode arch=compute_89,code=sm_89
              -gencode arch=compute_120,code=sm_120
            spill_fail_archs: sm_120
    # Pinned to windows-2022. windows-latest now points at Server 2025, where
    # the CUDA installer dies with exit 0xE0E1E1D9 before reaching any of our
    # source. The Windows artifact is the one that MATTERS most here: it is the
    # build that can actually be run, on the RTX 4090 in the dev box, which is
    # the only GPU anywhere in this pipeline. Non-blocking only until the
    # install is proven.
    #
    # The CUDA 13 builds are non-blocking too, and that one is deliberate, not
    # provisional. miner-build.yml takes its cores from the newest SUCCESSFUL
    # run of this workflow. If a CUDA 13 failure failed the run, the installers
    # would silently ship the previous run's 12.8 core -- the core every rig
    # needs, gone stale for the sake of a 3% extra on one card. Non-blocking,
    # the run still succeeds, the 12.8 core is current, and miner-build warns
    # that the CUDA 13 one is missing.
    continue-on-error: ${{ matrix.os == 'windows-2022' || matrix.variant != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A GPU-less runner still installs the compiler and headers; only the
      # runtime components are needed to build.
      # The sub-package names are NOT the same on the two platforms, which is
      # what made the Windows job fail for four runs with exit 0xE0E1E1D9. The
      # action passes them straight to the installer, and the log showed it
      # invoking `cuda_installer.exe -s nvcc_12.8 cudart_12.8 cudart-dev_12.8
      # nvrtc-dev_12.8`. Those hyphenated `-dev` components are LINUX naming;
      # Windows ships headers inside `cudart` and has no `-dev` split, so the
      # installer rejects the argument list and exits non-zero before installing
      # anything. Hence a list per matrix entry rather than one shared list.
      - name: Install the CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: 'network'
          sub-packages: ${{ matrix.subpackages }}

      # nvcc on Windows does not compile anything itself — it drives MSVC's
      # cl.exe as the host compiler and fails with "Cannot find compiler
      # 'cl.exe' in PATH" without it. MSVC is installed on the runner but is not
      # on PATH until its environment is sourced, and the bash shell the compile
      # step uses certainly does not have it. This is the same hard dependency
      # that makes the core unbuildable on the dev box.
      - name: Put MSVC on PATH (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # And check it is the toolkit this entry asked for. The CUDA 13 core is
      # worth shipping only because of what ptxas 13 does to the sm_120 fold; a
      # 12.x nvcc that happened to be on PATH would build a "cu13" core that is
      # just the 12.8 one again, and nothing downstream could tell.
      - name: Report the toolchain
        shell: bash
        run: |
          # Captured, not piped into grep -q: under Actions' `bash -eo pipefail`
          # a grep that exits on its first match can SIGPIPE nvcc and fail the
          # step ON a match -- and this check runs in the blocking 12.8 job too.
          v=$(nvcc --version)
          echo "$v"
          node --version
          case "$v" in
            *"release ${{ matrix.release }},"*) ;;
            *) echo "::error::expected CUDA ${{ matrix.release }}, got the nvcc above"; exit 1 ;;
          esac

      - name: Install node-addon-api
        working-directory: earn/native
        run: npm install --no-save node-addon-api node-gyp

      # Compile the CUDA half into a static library. sm_86/89/120 covers Ampere,
      # Ada and Blackwell — the cards the app actually targets. The CUDA 13
      # entries pass sm_89 and sm_120; every other flag is the same.
      - name: Compile the CUDA kernels
        working-directory: earn/native
        shell: bash
        run: |
          mkdir -p cuda-build
          # The addon is a shared object, so on Linux everything linked into it
          # must be position-independent — without this ld rejects the archive
          # with "relocation R_X86_64_PC32 ... can not be used when making a
          # shared object". MSVC has no equivalent flag and needs none.
          if [ "$RUNNER_OS" = "Linux" ]; then FPIC="-Xcompiler -fPIC"; else FPIC=""; fi
          # -Xptxas -v: ptxas prints registers and spills per kernel and
          # architecture on stderr. Kept in cuda-build/ for the spill check in
          # the next step. Under the runner's pipefail a failed nvcc still
          # fails this step through the tee.
          nvcc -O3 -std=c++17 -cudart static $FPIC \
            ${{ matrix.gencode }} \
            -Xptxas -v \
            -c src/pearl_kernel.cu -o cuda-build/pearl_kernel.o 2>&1 | tee cuda-build/ptxas-kernel.txt
          nvcc -O3 -std=c++17 -cudart static $FPIC \
            ${{ matrix.gencode }} \
            -c src/pearl_host.cu -o cuda-build/pearl_host.o

      # The tall fold sits at 253-255 registers (probes/README.md: 255 or fewer
      # and 0 spill after any edit). A compiler or gate change that pushes it
      # over spills to local memory, and the kernel still compiles, links and
      # ships; nothing else in CI can see that. This reads what ptxas said
      # above for both fold kernels on every architecture and prints one row
      # each. A spill fails the job only on the architectures in the entry's
      # spill_fail_archs: the ones the tuning log has a 0-spill figure for
      # under that compiler. Anywhere else it is a warning, so a build nobody
      # has measured (sm_89 under 13.3, sm_86, sm_120 under 12.8) cannot take
      # a measured core out of a release: a failed cu13 job uploads no
      # pearl_core_cu13.node, and a failed ubuntu 12.8 job makes
      # miner-build.yml fall back to the previous run's core. If one of the
      # warned builds turns out to spill, that is a finding to record, not a
      # reason to drop the check. Needs no GPU.
      - name: Check the fold kernels for register spills
        working-directory: earn/native
        shell: bash
        run: |
          # tr: on Windows nvcc writes CRLF, which would break every anchored match.
          log=$(tr -d '\r' < cuda-build/ptxas-kernel.txt)
          # One row per kernel and architecture: name arch registers stores loads.
          # A block runs from one "Compiling entry function" line to the next.
          # Every spill line in it is summed: a spill in a function the kernel
          # calls without inlining is a spill in the kernel.
          rows=$(printf '%s\n' "$log" | awk '
            function flush() {
              if (name != "") printf "%s %s %s %d %d\n", name, arch, regs, stores, loads
              name = ""; arch = "?"; regs = "?"; stores = 0; loads = 0
            }
            /Compiling entry function/ {
              flush()
              for (i = 1; i <= NF; i++) {
                if ($i == "function") name = substr($(i + 1), 2, length($(i + 1)) - 2)
                if ($i == "for") arch = substr($(i + 1), 2, length($(i + 1)) - 2)
              }
              next
            }
            /bytes spill stores/ {
              if (match($0, /[0-9]+ bytes spill stores/)) stores += substr($0, RSTART, RLENGTH - 19)
              if (match($0, /[0-9]+ bytes spill loads/)) loads += substr($0, RSTART, RLENGTH - 18)
            }
            /Used [0-9]+ registers/ {
              match($0, /Used [0-9]+ registers/); regs = substr($0, RSTART + 5, RLENGTH - 15)
            }
            END { flush() }')
          # Padded with spaces so the case pattern matches whole words only.
          fail_archs=" ${{ matrix.spill_fail_archs }} "
          bad=0
          seen_tall=0
          seen_wmma=0
          while read -r name arch regs stores loads; do
            case "$name" in
              pearl_tile_fold_tall) seen_tall=1 ;;
              pearl_tile_fold_wmma) seen_wmma=1 ;;
              *) continue ;;
            esac
            echo "$arch $name: $regs registers, $stores bytes spill stores, $loads bytes spill loads"
            if [ "$stores" != 0 ] || [ "$loads" != 0 ]; then
              case "$fail_archs" in
                *" $arch "*)
                  echo "::error::$name spills on $arch ($stores bytes stored, $loads loaded); the fold must fit in 255 registers with 0 spill"
                  bad=1 ;;
                *)
                  echo "::warning::$name spills on $arch ($stores bytes stored, $loads loaded); not failing the job, this build is unmeasured (spill_fail_archs: ${{ matrix.spill_fail_archs }})" ;;
              esac
            fi
          done <<< "$rows"
          # Nothing found is a failure, not a pass: the names changed, or ptxas
          # was not run with -v.
          if [ "$seen_tall" != 1 ] || [ "$seen_wmma" != 1 ]; then
            echo "::error::ptxas -v output has no entry for both pearl_tile_fold_tall and pearl_tile_fold_wmma; was pearl_kernel.cu compiled with -Xptxas -v?"
            exit 1
          fi
          exit $bad

      # The Blackwell tall fold's two TMA descriptors must sit at 128-byte-aligned
      # parameter addresses. In v0.5.7 and v0.5.8 the Windows builds put them at
      # offsets 0x98 and 0x118 -- cuda.h aligns CUtensorMap only when __cplusplus
      # says C++11, and MSVC says 199711L -- and every Blackwell card on Windows
      # failed its first TMA load with "misaligned address". Nothing else in this
      # workflow could see that: it compiles, links and ships. The fix
      # (src/pearl_tensor_map.h) spells the alignment in our own code; this step
      # reads what the compiler actually did, so the fault cannot come back
      # quietly. Every entry builds sm_120, so every entry runs it.
      #
      # 128, not the hardware's 64: 128 is what the code asks for, so anything
      # less means the declared alignment was lost, which is the bug. A 64 check
      # would pass such a build whenever the parameters before the descriptors
      # happened to add up to a multiple of 64, and the fault would return with
      # the next parameter change.
      #
      # The address checked is the parameter bank's base (EIATTR_PARAM_CBANK: the
      # low 16 bits are the offset, 0x380 on sm_120) plus each descriptor's offset
      # (EIATTR_KPARAM_INFO, Size 0x80). On sm_120 the base is itself a multiple
      # of 128, so this is the same as checking the offsets, but it stays right if
      # a toolkit moves the base. Only sm_120's copy is checked: it is the only
      # build that reads the descriptors.
      #
      # Anything the step cannot find is a failure, not a pass: no cuobjdump, no
      # sm_120 ELF, no bank base, or not exactly two 128-byte parameters. A
      # failed Windows job is non-blocking here, but it then uploads no core, and
      # miner-build.yml's Windows job fails on a missing one
      # (if_no_artifact_found: fail) rather than ship it.
      #
      # Not added: -Xcompiler /Zc:__cplusplus on the Windows compiles. It would
      # fix cuda.h's guard too, but it changes __cplusplus for every header nvcc
      # and cl.exe read on Windows, in ways no build here has been run with,
      # and pearl_tensor_map.h no longer depends on it.
      - name: Check the tensor-map parameter offsets
        working-directory: earn/native
        shell: bash
        run: |
          if ! command -v cuobjdump >/dev/null; then
            echo "::error::cuobjdump is not on PATH, so the tall fold's parameters cannot be checked"
            exit 1
          fi
          # tr: cuobjdump.exe writes CRLF, which would break every anchored match.
          elf=$(cuobjdump -elf cuda-build/pearl_kernel.o | tr -d '\r')
          # The .nv.info section of the tall fold, from the sm_120 ELF only. Each
          # embedded ELF is introduced by an "arch = sm_XX" line.
          info=$(printf '%s\n' "$elf" | awk '
            /^arch = / { arch = $3 }
            /^\.nv\.info\.pearl_tile_fold_tall$/ { inside = (arch == "sm_120"); next }
            /^\./ { inside = 0 }
            inside')
          if [ -z "$info" ]; then
            echo "::error::no .nv.info.pearl_tile_fold_tall section for sm_120 in cuobjdump -elf output"
            exit 1
          fi
          # `|| true`: under the runner's `bash -eo pipefail` a grep that matches
          # nothing would end the step here, before the error that says why.
          base=$(printf '%s\n' "$info" | grep -A3 'EIATTR_PARAM_CBANK' \
            | sed -n 's/.*Value:[[:space:]]*0x[0-9a-fA-F]*[[:space:]]*0x\([0-9a-fA-F]*\).*/\1/p' \
            | head -n 1 || true)
          offs=$(printf '%s\n' "$info" | grep -E 'Size[[:space:]]*:[[:space:]]*0x80([^0-9a-fA-F]|$)' \
            | sed -n 's/.*Offset[[:space:]]*:[[:space:]]*0x\([0-9a-fA-F]*\).*/\1/p' || true)
          if [ -z "$base" ]; then
            echo "::error::no EIATTR_PARAM_CBANK for the tall fold; cannot tell where its parameters start"
            exit 1
          fi
          n=$(printf '%s\n' "$offs" | grep -c . || true)
          if [ "$n" != 2 ]; then
            echo "::error::expected the tall fold's two 128-byte tensor-map parameters, found $n"
            exit 1
          fi
          bank=$(( 16#$base & 0xffff ))
          printf 'sm_120 pearl_tile_fold_tall: parameters start at c[0x0][0x%x]\n' "$bank"
          bad=0
          for off in $offs; do
            addr=$(( bank + 16#$off ))
            printf 'tensor map: offset 0x%x, address c[0x0][0x%x]\n' $(( 16#$off )) "$addr"
            if [ $(( addr % 128 )) -ne 0 ]; then
              echo "::error::a tensor map is at c[0x0][$(printf '0x%x' "$addr")], not 128-byte aligned; TMA loads will fault with 'misaligned address'"
              bad=1
            fi
          done
          exit $bad

      # Deliberately NOT build/: the next step runs `node-gyp rebuild`, whose
      # clean phase deletes that directory — which is what produced
      # "cannot find -lpearl_cuda" at link time.
      - name: Archive the CUDA objects into a library
        working-directory: earn/native
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            nvcc -lib -cudart static cuda-build/pearl_kernel.o cuda-build/pearl_host.o -o cuda-build/pearl_cuda.lib
          else
            ar rcs cuda-build/libpearl_cuda.a cuda-build/pearl_kernel.o cuda-build/pearl_host.o
          fi

      # The real prize: this LINKS, so a drift between pearl_core.cc's extern "C"
      # declarations and pearl_host.cu's definitions fails the build here rather
      # than on somebody's GPU box.
      - name: Build the N-API addon
        working-directory: earn/native
        run: npx node-gyp rebuild

      # node-gyp names the addon after its target, pearl_core, whichever toolkit
      # built it. The CUDA 13 one ships under its own name so the two can sit
      # side by side in an install; an N-API addon registers itself on load, so
      # the file name is free to differ from the target's.
      - name: Confirm the addon was produced
        working-directory: earn/native
        shell: bash
        run: |
          test -f build/Release/pearl_core.node
          if [ "${{ matrix.file }}" != pearl_core.node ]; then
            cp build/Release/pearl_core.node "build/Release/${{ matrix.file }}"
          fi
          echo "built: $(ls -l "build/Release/${{ matrix.file }}")"

      - uses: actions/upload-artifact@v4
        with:
          name: pearl-core${{ matrix.variant }}-${{ matrix.os }}
          path: earn/native/build/Release/${{ matrix.file }}
          if-no-files-found: error
