# Temporary, for issue #287 item 8 (RDNA 3 prefetch schedule). Not for the release: drop this file and
# .github/item8/ before merging. It compiles each flag set in .github/item8/variants.txt for gfx1100 with
# the release's toolchain (the image native-core.yml pins), runs test/variant-check.sh on it, and uploads
# the device assembly, so the schedule can be read without an AMD card.
name: item8 asm

on:
  push:
    branches: ['exp/287-8']

jobs:
  asm:
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:7.2@sha256:749f9ee120c739682cc2e1553e62632c2676f98bc49e4d8133f380e0af682bcc
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Variant check
        working-directory: earn/native/amd
        shell: bash
        run: |
          set -u
          ./build-amd.sh check gfx1100 > /dev/null
          v=$(grep -v '^#' ../../../.github/item8/variants.txt | grep -v '^$' | paste -sd ';')
          for a in gfx1100; do
            ARCH=$a CHECK_ROOT="$GITHUB_WORKSPACE/vcheck/$a" VARIANTS="$v" bash test/variant-check.sh
            cp build/check/$a.txt "$GITHUB_WORKSPACE/vcheck/$a/check-last.txt" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item8-asm
          path: vcheck
