name: Earn build (Windows + Linux)

# Builds the LLMJob Earn (earn) desktop app for Windows and Linux. Runs the
# unit tests, then produces the NSIS installer (Windows) and AppImage (Linux)
# on their respective runners and uploads them as artifacts.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    paths: [ 'earn/**', '.github/workflows/miner-build.yml' ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the installers to a GitHub Release (v<version> from earn/package.json)'
        type: boolean
        default: false

# A v* tag — or a manual run with "publish" checked — publishes the installers
# to a GitHub Release (see the build step).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: llmjob-earn-windows
            dist_path: |
              earn/dist/*.exe
              earn/dist/*.blockmap
          - os: ubuntu-latest
            platform: linux
            artifact: llmjob-earn-linux
            dist_path: |
              earn/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: earn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test (100% coverage gate)
        run: npm test

      # Stage the miner into vendor/engine so the installer ships it and end
      # users don't fetch an unsigned binary at runtime. Best-effort: if the
      # download fails — or the runner's antivirus quarantines the miner before
      # it can be packaged — the build still succeeds and the app falls back to
      # the on-demand download (extraResources then ships only the README
      # placeholder). Making bundling reliable on a Defender-enabled runner is a
      # separate decision (e.g. a self-hosted runner) and is intentionally not
      # done here.
      # Only the 1.8.6 fallback is staged. The 1.9.1b package used to be staged
      # beside it, but its launcher cannot start from a path containing a space
      # and the installer's home is "C:\Program Files\LLMJob Earn" — so that
      # bundle could never run on a real install (see packagedLauncherRuns in
      # src/shared/engine.js), and shipping it only added ~22 MB of launcher +
      # core to every installer for a binary the app now declines to use.
      # Versions and URLs come from src/shared/engine.js so a bump needs no
      # workflow edit.
      - name: Bundle mining engines — Windows (best-effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The 1.8.6 fallback, under the legacy unversioned name main.js
          # looks for when the selected version has no bundle.
          $zip = "$env:RUNNER_TEMP\engine.zip"
          Invoke-WebRequest 'https://pearl.alphapool.tech/downloads/AlphaMiner-Pearl-Windows.zip' -OutFile $zip
          $tmp = "$env:RUNNER_TEMP\engine-x"
          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          $exe = Get-ChildItem $tmp -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'no .exe inside engine archive' }
          Copy-Item $exe.FullName 'vendor/engine/alpha-miner-windows.exe' -Force
          Write-Host "Bundled engine: $((Get-Item 'vendor/engine/alpha-miner-windows.exe').Length) bytes"

      # Same for Linux, with BOTH builds staged rather than one: the engine is
      # chosen per rig at run time from the NVIDIA driver (>= 580 gets the faster
      # CUDA 13 line, older drivers the CUDA 12 stable), so baking in a single
      # binary would defeat that choice — which is why this used to bundle
      # nothing at all. bundledEnginePath is version-aware, so a rig picks
      # whichever of the two matches its driver and only falls back to the
      # download when neither does (an AppImage older than a version bump).
      # Shipping the engine also means a rig whose HTTPS is intercepted by a
      # proxy or antivirus still mines instead of dying on a certificate error.
      - name: Bundle mining engines — Linux (best-effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -euo pipefail
          # Versions AND their download URLs come from the app itself, so bumping
          # ENGINE in src/shared/engine.js is picked up here with no workflow
          # edit. The URL has to come from the module too now: a packaged version
          # (1.9.1b) lives on GitHub releases, not the pool, so hardcoding the
          # /downloads/ path here would silently 404 for it.
          node -e '
            const e = require("./src/shared/engine");
            for (const v of [e.ENGINE.preferred, e.ENGINE.fallback]) {
              const pkg = e.enginePackage("linux", v);
              process.stdout.write([
                v,
                e.engineDownloadUrl("linux", null, null, v),
                pkg ? pkg.dir + "/" + pkg.launcher : "",
                pkg ? pkg.dir + "/" + pkg.core : "",
              ].join("\t") + "\n");
            }
          ' > "$RUNNER_TEMP/engines.tsv"
          while IFS=$'\t' read -r v url launcher core; do
            if [ -n "$launcher" ]; then
              # Packaged: a tarball whose top folder holds the launcher beside its
              # hidden core. Both need +x — the launcher refuses to start if the
              # core is not executable — and the AppImage's squashfs preserves the
              # mode set here. Assert both landed: a launcher bundled WITHOUT its
              # core is worse than no bundle at all, because bundledEnginePath
              # only looks for the launcher and would skip the runtime download.
              curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/engine-pkg.tar.gz" "$url"
              tar -xzf "$RUNNER_TEMP/engine-pkg.tar.gz" -C vendor/engine
              chmod +x "vendor/engine/$launcher" "vendor/engine/$core"
              test -x "vendor/engine/$launcher" && test -x "vendor/engine/$core"
              echo "Bundled packaged engine $v -> vendor/engine/$launcher (+ core)"
            else
              out="vendor/engine/alpha-miner-$v"
              curl -fsSL --retry 3 --retry-delay 2 -o "$out" "$url"
              # The packaged binary is spawned straight out of the read-only
              # AppImage mount, so it has to carry +x through squashfs.
              chmod +x "$out"
              echo "Bundled engine $v: $(stat -c%s "$out") bytes"
            fi
          done < "$RUNNER_TEMP/engines.tsv"

      - name: Build installer (publishes on v* tag or manual publish)
        run: npx electron-builder --${{ matrix.platform }} --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Package the headless CLI (src/cli) into a standalone single-file Linux
      # binary via Node SEA. This is the self-updating artifact: the running
      # binary pulls a newer copy of itself from the release (src/cli/selfUpdater.js).
      - name: Package headless CLI binary (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:cli

      # Wrap the CLI binary in the HiveOS custom-miner package (hiveos/ hook
      # scripts + binary → llmjob-earn-<version>.tar.gz, plus an unversioned
      # legacy copy), the file flight sheets install from. The versioned stem is
      # CUSTOM_NAME because HiveOS derives the miner name from the filename.
      - name: Package HiveOS custom miner (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:hiveos

      # Attach the CLI binary and the HiveOS package to the same GitHub Release
      # electron-builder published to (v<version> from package.json), so the
      # self-updater and flight sheets can find them. Only on a v* tag or a
      # manual publish.
      - name: Publish CLI + HiveOS package to release (Linux, on v* tag or manual publish)
        if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" dist/llmjob-earn-cli-linux "dist/llmjob-earn-$VERSION.tar.gz" dist/llmjob-earn-hiveos.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      # electron-builder publishes the release with a BLANK body and a bare
      # "<version>" title, and nothing downstream ever wrote one — every release
      # through v0.3.13 shipped with an empty changelog that had to be filled in
      # by hand afterwards, and several never were. Generate it here instead,
      # from GitHub's own generate-notes endpoint (the same thing the "Generate
      # release notes" button produces: merged PRs since the previous release,
      # plus the compare link).
      #
      # Runs on the Linux job only, so the two matrix jobs cannot race to write
      # the same body. The release already exists by this point — the build step
      # above published to it — so a missing release here is a real failure and
      # is left to fail the job rather than be swallowed.
      #
      # Guarded on the body being empty: a re-run of this workflow (or a manual
      # publish over an existing tag) must not clobber notes someone wrote by
      # hand. In that case only the title is corrected, which is idempotent.
      - name: Write release notes (Linux, on v* tag or manual publish)
        if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')
          if [ -n "$(printf '%s' "$existing" | tr -d '[:space:]')" ]; then
            echo "$TAG already has a release body — leaving it alone, fixing the title only."
            gh release edit "$TAG" --title "LLMJob Earn $VERSION" --repo "$GITHUB_REPOSITORY"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq '.body' > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --title "LLMJob Earn $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          fi

          # Verify it took, rather than trusting the exit codes above.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,body \
            --jq '"title=\(.name) draft=\(.isDraft) body=\(.body | length) chars"'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_path }}
          if-no-files-found: error

      - name: Upload CLI binary artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: llmjob-earn-cli-linux
          path: |
            earn/dist/llmjob-earn-cli-linux
            earn/dist/llmjob-earn-[0-9]*.tar.gz
            earn/dist/llmjob-earn-hiveos.tar.gz
          if-no-files-found: error
