name: Earn build (Windows + Linux)

# Builds the LLMJob Earn (earn) desktop app for Windows and Linux. Runs the unit
# tests, then produces the NSIS installer (Windows) and the AppImage (Linux) on
# their respective runners and uploads them as artifacts. macOS is deliberately
# not built here -- see the commented-out matrix entry below.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    paths: [ 'earn/**', '.github/workflows/miner-build.yml', '.github/scripts/pick-core-run.sh' ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the installers to a GitHub Release (v<version> from earn/package.json)'
        type: boolean
        default: false

# A v* tag — or a manual run with "publish" checked — publishes the installers
# to a GitHub Release (see the build step).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: llmjob-earn-windows
            dist_path: |
              earn/dist/*.exe
              earn/dist/*.blockmap
          - os: ubuntu-latest
            platform: linux
            artifact: llmjob-earn-linux
            dist_path: |
              earn/dist/*.AppImage
          # macOS is NOT built or published. The build works, but the app has
          # not been exercised on a Mac recently enough to ship: it never mines
          # there (AlphaPool has no Darwin engine, so src/shared/platform.js
          # refuses the miner up front), which leaves the local-LLM half as the
          # whole product on that platform and the least-tested half of it.
          #
          # Nothing is deleted: the ad-hoc signing hook (earn/scripts/
          # mac-adhoc-sign.mjs) and the electron-builder mac target stay, so
          # restoring this is re-adding the four lines below.
          #
          #   - os: macos-latest
          #     platform: mac
          #     artifact: llmjob-earn-macos
          #     dist_path: |
          #       earn/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: earn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test (100% coverage gate)
        run: npm test

      # Stage our own CUDA core so the installer ships it.
      #
      # This is no longer best-effort. alpha-miner is gone, so pearl_core.node IS
      # the engine — an installer without it produces an app that starts, says
      # the core is not built, and mines nothing. It is downloaded from the
      # native-core workflow's artifact rather than rebuilt here, because
      # building it needs the CUDA toolkit and this runner does not have one.
      #
      # Which native-core run to take the cores from: the one for this commit,
      # or, when it has none, one whose commit has the same earn/native and
      # native-core.yml (usually main's). The rules are at the top of
      # .github/scripts/pick-core-run.sh. If that run is still going, this step
      # waits for it, about 4 minutes. A release tag always has a run of its
      # own, because the tag push itself starts native-core.
      - name: Pick the native-core run
        id: pick
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: bash
        # The script gives up waiting after 25 minutes; this also covers a
        # hung API call.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ../.github/scripts/pick-core-run.sh

      - name: Stage the Pearl core
        if: runner.os == 'Windows' || runner.os == 'Linux'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: native-core.yml
          run_id: ${{ steps.pick.outputs.run_id }}
          name: pearl-core-${{ runner.os == 'Windows' && 'windows-2022' || 'ubuntu-latest' }}
          path: earn/vendor/native
          # An installer without the core is an app that starts, reports the
          # Pearl core is not built, and mines nothing. There is no second
          # engine to fall back to, so this is a hard failure rather than a
          # warning nobody reads on the way to a release.
          if_no_artifact_found: fail

      # The CUDA 13 build of the core: sm_120 only, loaded instead of the one
      # above on an all-Blackwell rig with driver 580+ (src/shared/coreVariant.js)
      # for about 3% more hashrate on an RTX 5090. Both shells pick it up from
      # the same directory, so electron-builder's vendor/native → resources/native
      # rule ships it with no config change.
      #
      # From the SAME native-core run as the 12.8 core, by run id, never "the
      # newest run that has one": a pair built from two different commits is a
      # version skew between two cores the same app may load.
      #
      # Optional, but loud. Without it every rig mines exactly as it did before
      # there were two cores; a 5090 just leaves ~3% on the table. Failing the
      # build instead would hold back a release that works for every card over
      # a speed-up for one -- and the CUDA 13 job is the newer, less proven of
      # the two (on Windows especially). So: warn here, warn in the verify step
      # and the run summary, ship the 12.8 core.
      - name: Stage the CUDA 13 Pearl core (RTX 50 series)
        if: runner.os == 'Windows' || runner.os == 'Linux'
        # if_no_artifact_found covers only "not there"; any other error in the
        # action (an API hiccup, a failed download) calls setFailed. Optional
        # has to mean optional: the verify step below still says it is missing.
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: native-core.yml
          run_id: ${{ steps.pick.outputs.run_id }}
          name: pearl-core-cu13-${{ runner.os == 'Windows' && 'windows-2022' || 'ubuntu-latest' }}
          path: earn/vendor/native
          if_no_artifact_found: warn

      - name: Verify the core is really there
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: bash
        working-directory: earn
        run: |
          test -f vendor/native/pearl_core.node \
            || { echo "::error::no pearl_core.node staged — this build cannot mine"; exit 1; }
          echo "staged core: $(ls -l vendor/native/pearl_core.node)"
          if [ -f vendor/native/pearl_core_cu13.node ]; then
            echo "staged CUDA 13 core: $(ls -l vendor/native/pearl_core_cu13.node)"
          else
            msg="no pearl_core_cu13.node staged — RTX 50 rigs will mine on the CUDA 12.8 core (about 3% slower on a 5090). Check the native-core run's -cu13 job."
            echo "::warning::$msg"
            echo "**Warning:** $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build installer (publishes on v* tag or manual publish)
        run: npx electron-builder --${{ matrix.platform }} --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Package the headless CLI (src/cli) into a standalone single-file Linux
      # binary via Node SEA. This is the self-updating artifact: the running
      # binary pulls a newer copy of itself from the release (src/cli/selfUpdater.js).
      - name: Package headless CLI binary (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:cli

      # The HiveOS custom-miner package is NOT built or published. The packaging
      # script (scripts/build-hiveos.mjs) and hook scripts (hiveos/) are still in
      # the tree, so restoring this is re-adding two lines -- but it has not been
      # exercised in weeks and a release should not carry an artifact nobody has
      # verified. Flight sheets pinned to a previous release keep working; they
      # install by URL from whichever release they already name.

      # Attach the CLI binary to the same GitHub Release electron-builder
      # published to (v<version> from package.json), so the self-updater can find
      # it. Only on a v* tag or a manual publish.
      - name: Publish CLI to release (Linux, on v* tag or manual publish)
        if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # pearl_core.node rides beside the CLI: a SEA binary cannot dlopen an
          # addon out of its snapshot, so the loader probes next to the
          # executable and the self-updater downloads this asset to keep the
          # pair in step.
          #
          # Cores FIRST, the binary last. electron-builder has already made this
          # release live (releaseType "release"), and the self-updater acts on
          # the binary asset alone: until that exists the release reads as
          # "asset-missing" and no rig updates. Uploaded together, a rig that
          # checked mid-upload could take the new binary before its cores were
          # there -- keeping an old pearl_core.node, and (a missing CUDA 13 core
          # meaning "delete the old one") dropping a 5090 to the 12.8 core until
          # the next release.
          gh release upload "v$VERSION" dist/pearl_core.node --clobber --repo "$GITHUB_REPOSITORY"
          # The CUDA 13 core, when this build staged one. When it did not,
          # delete any copy an earlier run of this workflow left on the release:
          # that one came from a different native-core run than the 12.8 core
          # just uploaded, and the self-updater would pair them.
          if [ -f dist/pearl_core_cu13.node ]; then
            gh release upload "v$VERSION" dist/pearl_core_cu13.node --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::publishing v$VERSION without pearl_core_cu13.node"
            gh release delete-asset "v$VERSION" pearl_core_cu13.node --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          fi
          gh release upload "v$VERSION" dist/llmjob-earn-cli-linux --clobber --repo "$GITHUB_REPOSITORY"

      # electron-builder publishes the release with a BLANK body and a bare
      # "<version>" title, and nothing downstream ever wrote one — every release
      # through v0.3.13 shipped with an empty changelog that had to be filled in
      # by hand afterwards, and several never were. Generate it here instead,
      # from GitHub's own generate-notes endpoint (the same thing the "Generate
      # release notes" button produces: merged PRs since the previous release,
      # plus the compare link).
      #
      # Runs on the Linux job only, so the two matrix jobs cannot race to write
      # the same body. The release already exists by this point — the build step
      # above published to it — so a missing release here is a real failure and
      # is left to fail the job rather than be swallowed.
      #
      # Guarded on the body being empty: a re-run of this workflow (or a manual
      # publish over an existing tag) must not clobber notes someone wrote by
      # hand. In that case only the title is corrected, which is idempotent.
      # Release notes come from the release PR's own body, with GitHub's
      # generated PR list appended under it.
      #
      # This step used to publish ONLY the generated list, which by construction
      # is "## What's Changed" plus one bullet per merged PR — for a release
      # branch that reads "Release v0.3.17" and tells a user nothing about the
      # bug that made their rig mine zero. Meanwhile a real changelog already
      # existed and went unread: the release PR body, written and reviewed before
      # the merge. So publish that, and keep the generated list as the index it
      # is good at being.
      #
      # It replaced hand-written notes because those got skipped — v0.3.12 and
      # v0.3.13 shipped with completely blank bodies — so the fallbacks matter
      # more than the happy path: no PR number, an empty PR body, or a failed
      # lookup all still yield the generated list rather than nothing.
      - name: Write release notes (Linux, on v* tag or manual publish)
        if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')
          if [ -n "$(printf '%s' "$existing" | tr -d '[:space:]')" ]; then
            echo "$TAG already has a release body — leaving it alone, fixing the title only."
            gh release edit "$TAG" --title "LLMJob Earn $VERSION" --repo "$GITHUB_REPOSITORY"
          else
            NOTES="$RUNNER_TEMP/notes.md"
            : > "$NOTES"

            # The tagged commit is the merge (or squash) of the release PR, so its
            # subject carries the number: "Merge pull request #196 from …" or the
            # squash form "Title (#196)". Either way, take the first #N.
            SUBJECT=$(git log -1 --format=%s HEAD || true)
            PR=$(printf '%s' "$SUBJECT" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
            if [ -n "${PR:-}" ]; then
              echo "release notes: reading PR #$PR"
              if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' \
                   > "$RUNNER_TEMP/pr-body.md" 2>/dev/null \
                 && [ -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/pr-body.md")" ]; then
                cat "$RUNNER_TEMP/pr-body.md" >> "$NOTES"
                printf '\n\n---\n\n' >> "$NOTES"
              else
                echo "PR #$PR had no usable body — generated notes only."
              fi
            else
              echo "no PR number in '$SUBJECT' — generated notes only."
            fi

            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq '.body' >> "$NOTES"

            gh release edit "$TAG" --title "LLMJob Earn $VERSION" \
              --notes-file "$NOTES" --repo "$GITHUB_REPOSITORY"
          fi

          # Verify it took, rather than trusting the exit codes above.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,body \
            --jq '"title=\(.name) draft=\(.isDraft) body=\(.body | length) chars"'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_path }}
          if-no-files-found: error

      - name: Upload CLI binary artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: llmjob-earn-cli-linux
          path: earn/dist/llmjob-earn-cli-linux
          if-no-files-found: error
