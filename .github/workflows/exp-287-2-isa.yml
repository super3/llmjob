# Temporary, for issue #287 item 2: the RDNA 3 fold's device code with and without buffer loads, in the image the
# release's AMD core is built in. Runs on exp/287-2 only, and is removed before that branch merges.
name: exp 287-2 isa

on:
  push:
    branches: [exp/287-2]

jobs:
  isa:
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:7.2@sha256:749f9ee120c739682cc2e1553e62632c2676f98bc49e4d8133f380e0af682bcc
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare the RDNA 3 fold's variants
        shell: bash
        run: bash .github/scripts/exp-287-2-isa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-287-2-isa
          path: build/isa
