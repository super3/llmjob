# TEMPORARY, for issue #287 item 4 only: remove before merging.
# The RDNA 4 fold's device assembly for the release and each variant, on the release's compiler (the pinned ROCm
# 7.2.0 image native-core.yml builds in), with test/variant-check.sh's row and counts; and each variant's fold
# check on the CPU (HIP-CPU) with the RDNA 4 set's loop, bit for bit against the CPU's transcripts.
name: amd isa 287-4 (temporary)

on:
  push:
    branches: ['exp/287-4']
    paths:
      - 'earn/native/**'
      - '.github/workflows/amd-isa-287-4.yml'
  workflow_dispatch:

env:
  VARIANTS: >-
    base=;
    tree=-DPEARL_AMD_RDTREE=1;
    late1=-DPEARL_AMD_RDLATE=1;
    late2=-DPEARL_AMD_RDLATE=2;
    late1t=-DPEARL_AMD_RDLATE=1 -DPEARL_AMD_RDTREE=1;
    late2t=-DPEARL_AMD_RDLATE=2 -DPEARL_AMD_RDTREE=1

jobs:
  isa:
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:7.2@sha256:749f9ee120c739682cc2e1553e62632c2676f98bc49e4d8133f380e0af682bcc
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Variants on gfx1201 and gfx1200
        working-directory: earn/native/amd
        shell: bash
        run: |
          set -u
          V=$(echo "$VARIANTS" | tr -d '\n' | sed 's/; */;/g; s/^ *//; s/ *$//')
          echo "variants: $V"
          for a in gfx1201 gfx1200; do
            mkdir -p "$PWD/isa/$a"
            VARIANTS="$V" ARCH=$a CHECK_ROOT="$PWD/isa/$a" bash test/variant-check.sh || true
            for f in "$PWD"/isa/$a/*.fold; do
              echo "$a $(basename "$f" .fold) fold md5 $(md5sum < "$f" | cut -c1-12)"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: amd-isa-287-4
          path: earn/native/amd/isa
          if-no-files-found: error

  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: HIP-CPU, clang and TBB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang libtbb-dev
          git clone -q --depth 1 https://github.com/ROCm/HIP-CPU /tmp/hip-cpu
      - name: Fold check of each variant, RDNA 4 loop, k 4096 and k 2048
        working-directory: earn/native/amd
        shell: bash
        run: |
          set -eu
          line=$(grep -n '^// A 16-byte global->shared copy that does not pass through registers' ../src/pearl_kernel.cu | head -n 1 | cut -d: -f1)
          mkdir -p build/gen
          head -n $((line - 1)) ../src/pearl_kernel.cu > build/gen/pearl_kernel_portable.cu
          # The RDNA 4 set's loop as a gfx12 pass builds it; RDSEL, RDPERM, BUFLD and the pins are GPU-only.
          SET="-DPEARL_AMD_PF2=1 -DPEARL_AMD_PFX=1 -DPEARL_AMD_TID=1 -DPEARL_AMD_KWRAP=1 -DPEARL_AMD_KPAIR=1 -DPEARL_AMD_CRANK=1 -DPEARL_AMD_SCHEDB=1 -DPEARL_AMD_LDS32=1 -DPEARL_AMD_LDS32_PIN=1"
          inc="-Icompat/cpu -Isrc -I../src -Ibuild/gen -I/tmp/hip-cpu/include"
          V=$(echo "$VARIANTS" | tr -d '\n' | sed 's/; */;/g; s/^ *//; s/ *$//')
          IFS=';' read -ra VS <<< "$V"
          fail=0
          for v in "${VS[@]}"; do
            n=${v%%=*}; f=${v#*=}
            clang++ -std=c++17 -O2 -DNDEBUG -Wno-psabi $SET $f $inc test/pearl_amd_foldtest.cpp -o build/ft_$n -ltbb -lpthread
            for k in 4096 2048; do
              if out=$(./build/ft_$n 256 512 3 1 1 wmma12 $k 2>&1); then
                echo "PASS $n k $k: $(echo "$out" | tail -n 1)"
              else
                echo "FAIL $n k $k"; echo "$out" | tail -n 8; fail=1
              fi
            done
          done
          exit $fail
