<!-- Styles for the shared site footer partial. Included from <head> after
     the page's own <style>, the same way legal-style is.

     Colours fall back to literals so a page that doesn't define the full palette
     still renders correctly (network.html has no --line-soft, for instance).
     A page that needs breathing room above the footer sets --foot-gap in :root
     rather than redefining the rule. -->
<style>
  footer.foot { border-top: 1px solid #ededea; max-width: 1080px; margin: var(--foot-gap, 0) auto 0; padding: 42px 28px 28px; color: var(--muted-3, #9a9da1); font-size: 14px; }
  .foot-inner { display: grid; grid-template-columns: 1.7fr repeat(3, minmax(0, 1fr)); gap: 34px 28px; }

  .foot-brand .logo { font-weight: 700; font-size: 16px; color: var(--muted, #5b5e62); display: inline-flex; align-items: center; gap: 9px; }
  .foot-brand .logo .bolt { width: 24px; height: 24px; border-radius: 7px; background: var(--dark, #1a1a17); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .foot-tag { margin-top: 13px; font-size: 13.5px; line-height: 1.55; color: var(--muted-3, #9a9da1); max-width: 21em; }

  .foot-col { display: flex; flex-direction: column; align-items: flex-start; gap: 11px; }
  .foot-h { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--muted-3, #9a9da1); opacity: .8; }
  .foot-col a { color: var(--muted, #5b5e62); font-size: 14px; transition: color .14s; }
  .foot-col a:hover { color: var(--ink, #0e0f10); }

  .foot-bottom { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line-soft, #ebeae5); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted-3, #9a9da1); }

  /* Two columns from tablet down; the brand takes the full width above them. */
  @media (max-width: 760px) {
    footer.foot { padding: 34px 18px 24px; }
    .foot-inner { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 20px; }
    .foot-brand { grid-column: 1 / -1; }
    .foot-tag { max-width: none; }
  }
</style>
