<!-- The shared site footer, built to the v2 handoff mock. Needs the footer-style
     partial included in the page's <head>.

     Brand block on the left carrying the copyright, three labelled link columns
     on the right: Use / Earn / More. The headings split the site by what a
     visitor came to do rather than by product area, which is why Chat and the
     docs sit together and Earn and Network sit together.

     The Log in link keeps id="foot-login" because index.html and earn.html
     attach a Clerk sign-in handler to it. On pages without that handler it
     simply follows its href, which is the same destination. -->
<footer class="foot">
  <div class="foot-inner">
    <div class="foot-brand">
      <a class="logo" href="/">
        <span class="bolt"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M13 2 L4 14 h6 l-1 8 10-13 h-7 l1-7 z"></path></svg></span>LLMJob
      </a>
      <p class="foot-tag">Your own AI, running on the hardware you already own.</p>
      <p class="foot-copy">© 2026 LLMJob</p>
    </div>

    <div class="foot-cols">
      <nav class="foot-col" aria-label="Use">
        <div class="foot-h">Use</div>
        <a href="/chat">Chat</a>
        <a href="/docs">Docs</a>
        <a href="/dashboard" id="foot-login">Log in</a>
      </nav>

      <nav class="foot-col" aria-label="Earn">
        <div class="foot-h">Earn</div>
        <a href="/earn">Run a node</a>
        <a href="/network">Network</a>
      </nav>

      <nav class="foot-col" aria-label="More">
        <div class="foot-h">More</div>
        <a href="{{discordUrl}}" target="_blank" rel="noopener">Discord</a>
        <a href="https://github.com/super3/llmjob" target="_blank" rel="noopener">GitHub</a>
        <a href="/terms">Terms</a>
        <a href="/privacy">Privacy</a>
      </nav>
    </div>
  </div>
</footer>
