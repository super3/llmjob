# HiveOS custom-miner manifest for LLMJob Earn (headless CLI).
# Needs a HiveOS image on Ubuntu 20.04 or newer: the mining cores need glibc 2.28.
#
# Flight sheet setup:
#   Miner             → Custom
#   Miner name        → llmjob-earn
#   Installation URL  → https://github.com/super3/llmjob/releases/latest/download/llmjob-earn-hiveos.tar.gz
#                       The miner updates itself from then on, so the URL never
#                       changes. --no-update in Extra config turns that off.
#   Wallet template   → your prl1p… address (or %WAL% with it as the wallet,
#                       or %WAL%.%WORKER_NAME%)
#   Pool URL          → us.pearl.herominers.com:1200. HiveOS requires the field,
#                       but it is not used: the miner picks the fastest
#                       HeroMiners region itself.
#   Everything else   → leave blank. Hash algorithm can be pearlhash.
#   Extra config      → optional CLI flags, e.g. --region de --mine-mem-clock 0
#
# The rig mines only (--mode mining) unless Extra config sets a mode. Add
# --mode auto to also serve a local LLM, which downloads a 5-18 GB model once.
#
# CUSTOM_VERSION is stamped by scripts/build-hiveos.mjs at package time.
CUSTOM_NAME=llmjob-earn
CUSTOM_VERSION=
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/llmjob-earn/llmjob-earn.conf
CUSTOM_LOG_BASENAME=/var/log/miner/custom/llmjob-earn/llmjob-earn
