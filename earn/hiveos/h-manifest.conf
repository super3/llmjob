# HiveOS custom-miner manifest for LLMJob Earn (headless CLI).
# Needs a HiveOS image on Ubuntu 20.04 or newer: the CLI (Node 22) needs glibc 2.28.
#
# Flight sheet setup:
#   Miner             → Custom
#   Miner name        → llmjob-earn
#   Installation URL  → https://github.com/super3/llmjob/releases/latest/download/llmjob-earn-hiveos.tar.gz
#                       The miner updates itself from then on, so the URL never
#                       changes. --no-update in Extra config turns that off.
#   Wallet template   → your prl1p… address (or %WAL% with it as the wallet,
#                       or %WAL%.%WORKER_NAME%)
#   Pool URL          → us.pearl.herominers.com:1200. HiveOS requires the field.
#                       With a HeroMiners address the miner picks the fastest
#                       HeroMiners region itself. Another pool's host:port,
#                       such as prl-us.kryptex.network:7048, is mined on.
#   Everything else   → leave blank. Hash algorithm can be pearlhash.
#   Extra config      → optional CLI flags, e.g. --region de --mine-mem-clock 0
#
# The rig mines only (--mode mining) unless Extra config sets a mode. Add
# --mode auto to also serve a local LLM, which downloads a 5-18 GB model once.
#
# Quantus (QTC, experimental): put your qz… address in the wallet template
# instead. Pool URL is then the Quantus pool: us.quantus.herominers.com:1155
# mines on HeroMiners in the nearest region, as for Pearl, and another Quantus
# pool's host:port, such as qtc-us.kryptex.network:7049, is mined on. A Pearl
# pool's address left there is not used: the rig mines Quantus on HeroMiners.
# --quantus-pool host:port in Extra config beats Pool URL. Hash algorithm can
# be quantus.
#
# Pearl's planned FP8 upgrade ends Pearl mining on RTX 20/30/40, AMD and Intel
# cards. Put --quantus-address qz… in Extra config beside a Pearl wallet and
# those cards move to Quantus by themselves when the pool switches; without it
# they stop. --card-coin 0:pearl,1:quantus in Extra config picks a coin for
# single cards now.
#
# CUSTOM_VERSION is stamped by scripts/build-hiveos.mjs at package time.
CUSTOM_NAME=llmjob-earn
CUSTOM_VERSION=
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/llmjob-earn/llmjob-earn.conf
CUSTOM_LOG_BASENAME=/var/log/miner/custom/llmjob-earn/llmjob-earn
