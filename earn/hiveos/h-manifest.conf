# HiveOS custom-miner manifest for LLMJob Earn (headless CLI).
# Needs the HiveOS 0.6 jammy image (Ubuntu 22.04): the mining core needs
# glibc 2.34, and the older focal image has 2.31.
#
# Flight sheet setup:
#   Miner             → Custom
#   Miner name        → llmjob-earn
#   Installation URL  → https://github.com/super3/llmjob/releases/download/v<version>/llmjob-earn-<version>.tar.gz
#                       (a new version needs a new URL: HiveOS keeps the old
#                       build while the file name stays the same)
#   Hash algorithm    → pearlhash
#   Wallet template   → %WAL% (your prl1p… address), or %WAL%.%WORKER_NAME%
#   Pool URL          → any host:port, e.g. us.pearl.herominers.com:1200. HiveOS
#                       requires the field, but it is not used: the miner picks
#                       the fastest HeroMiners region itself.
#   Pass              → leave blank
#   Extra config      → optional CLI flags, e.g. --region de --mine-mem-clock 0
#
# The rig mines only (--mode mining) unless Extra config sets a mode. Add
# --mode auto to also serve a local LLM, which downloads a 5-18 GB model once.
#
# CUSTOM_VERSION is stamped by scripts/build-hiveos.mjs at package time.
CUSTOM_NAME=llmjob-earn
CUSTOM_VERSION=
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/llmjob-earn/llmjob-earn.conf
CUSTOM_LOG_BASENAME=/var/log/miner/custom/llmjob-earn/llmjob-earn
